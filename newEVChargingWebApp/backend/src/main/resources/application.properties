spring.application.name=ev-charging-api
server.port=${PORT:8080}
# Needed on Render/Railway/etc.: use the real client IP from X-Forwarded-For (rate limiting) and https redirects.
server.forward-headers-strategy=framework
server.shutdown=graceful

# ---- Database (NO credentials in this file - set them as environment variables) ----
# Either set DB_URL (full JDBC url) or DB_HOST / DB_PORT / DB_NAME (used by the Render blueprint).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_charging_system}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Flyway: schema is owned by src/main/resources/db/migration ----
# baseline-on-migrate lets an already existing database (created from the old
# ev_charging_system.sql) be adopted at version 1; only V2+ are then applied.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# We use our own JWT filter, so do not generate the default in-memory user/password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---- Security ----
# JWT_SECRET is mandatory (>= 32 characters). The application refuses to start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
# Comma separated list of frontend origins allowed by CORS (add your deployed domain here).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Existing users with these e-mails are promoted to ADMIN at startup.

app.admin-emails=${ADMIN_EMAILS:}

# Super Admin Configuration
app.super-admin.name=${APP_SUPER_ADMIN_NAME:}
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:}
app.super-admin.mobile=${APP_SUPER_ADMIN_MOBILE:}
app.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:}



# ---- Business rules ----
# Booking/"now" comparisons use this zone (the browser sends local date-times without a zone).
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.booking.slot-minutes=${BOOKING_SLOT_MINUTES:60}
app.booking.early-start-minutes=${BOOKING_EARLY_START_MINUTES:5}
app.booking.grace-minutes=${BOOKING_GRACE_MINUTES:30}
app.booking.max-advance-days=${BOOKING_MAX_ADVANCE_DAYS:30}
app.booking.expiry-check-ms=${BOOKING_EXPIRY_CHECK_MS:60000}
app.wallet.min-topup=${WALLET_MIN_TOPUP:10}
app.wallet.max-topup=${WALLET_MAX_TOPUP:50000}
# DEV ONLY: lets the wallet be credited without a real payment. Keep false in production.
app.wallet.demo-topup-enabled=${WALLET_DEMO_TOPUP:false}

# ---- Razorpay (never expose the secret to the frontend) ----
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Frontend / e-mail ----
# Public URL of the frontend (used inside password-reset e-mails).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@smartev.local}
# true = print e-mails (incl. reset links) to the log when SMTP is not configured. LOCAL DEV ONLY.
app.mail.dev-log=${MAIL_DEV_LOG:false}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
# SMTP is switched on by setting SPRING_MAIL_HOST (+ SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Health check for the hosting platform: GET /actuator/health ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false


app.notification.read-retention-days=${NOTIFICATION_READ_RETENTION_DAYS:30}
app.notification.max-retention-days=${NOTIFICATION_MAX_RETENTION_DAYS:90}
